[tools]
betterleaks = "latest"
hk = "2"
jactionlint = "latest"
lychee = "latest"
node = "26"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
osv-scanner = "latest"
pkl = "latest"
rumdl = "latest"
typos = "latest"
uv = "latest"

# Задачи проекта живут здесь, Makefile только проксирует make <задача> в mise run.
[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["uv sync", "hk install"]

# Браузер ставится отдельной задачей: линтерам в check.yml он не нужен, а
# --with-deps тянет системные пакеты через apt.
[tasks.install-browsers]
description = "Поставить Chromium для Playwright с системными зависимостями"
run = "uv run playwright install --with-deps chromium"

[tasks.test]
description = "Тесты против стенда http.hexlet.app/python-playwright"
run = "uv run pytest"

[tasks.report-allure]
description = "Отчёт Allure по последнему прогону"
run = "allure serve allure-results"

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
