[pytest]
testpaths = tests
# Трейс и видео сохраняются только у упавших тестов. Сырые данные Allure
# пишутся в allure-results, а номер в @allure.issue превращается в ссылку
# на Issues этого репозитория.
addopts =
    --tracing=retain-on-failure
    --video=retain-on-failure
    --alluredir=allure-results
    --allure-link-pattern=issue:https://github.com/hexlet-components/python-playwright-example/issues/{}
